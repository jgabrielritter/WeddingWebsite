<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RSVP | Angelika & Gabe</title>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F97CTFSLEP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-F97CTFSLEP');
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --sand: #ffede3;
      --latte: #b18969;
      --forest: #2b3a2f;
      --accent: #c0a68c;
      --cream: #fff8f2;
      --error: #8b1c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Lato', sans-serif;
      background: var(--sand);
      color: var(--latte);
      line-height: 1.7;
      letter-spacing: 0.05em;
    }

    .site {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .hero {
      position: relative;
      background: url('./Angelika & Gabe_WebsiteFiles/TahoeView_Landscape.jpeg') center / cover no-repeat;
      color: var(--sand);
      text-align: center;
      padding: 80px 15px;
    }

    .hero::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(43, 58, 47, 0.6);
    }

    .hero__nav {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 30px;
    }

    .hero__content {
      position: relative;
      z-index: 1;
      max-width: 720px;
      margin: 0 auto;
    }

    .hero__title {
      font-size: clamp(42px, 9vw, 72px);
      font-weight: 300;
      text-transform: uppercase;
      margin: 0 0 10px;
    }

    .hero__subtitle {
      font-size: 22px;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      margin-bottom: 25px;
      color: var(--cream);
    }

    .hero__back-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: 1px solid var(--sand);
      border-radius: 999px;
      color: var(--sand);
      text-decoration: none;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .hero__back-link:hover,
    .hero__back-link:focus-visible {
      background: var(--sand);
      color: var(--forest);
    }

    .language-switcher {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--sand);
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .language-switcher label {
      margin: 0;
      color: inherit;
    }

    .language-switcher select {
      width: auto;
      border-radius: 999px;
      border: 1px solid var(--sand);
      padding: 8px 12px;
      background: rgba(255, 237, 227, 0.2);
      color: var(--sand);
      font-size: 14px;
      text-transform: none;
      letter-spacing: 0.05em;
    }

    .language-switcher select option {
      color: var(--forest);
    }

    main {
      flex: 1;
      padding: 60px 20px 80px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: var(--cream);
      border-radius: 24px;
      padding: 40px;
      width: min(640px, 100%);
      box-shadow: 0 20px 60px rgba(43, 58, 47, 0.15);
    }

    .card h2 {
      font-weight: 300;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-top: 0;
      margin-bottom: 10px;
      color: var(--forest);
      text-align: center;
    }

    .card p {
      margin-top: 0;
      margin-bottom: 30px;
      text-align: center;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      margin-bottom: 10px;
      color: var(--forest);
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid rgba(177, 137, 105, 0.4);
      background: white;
      font-size: 16px;
      letter-spacing: 0.05em;
      color: var(--forest);
      font-family: inherit;
      margin-bottom: 24px;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--latte) 50%),
        linear-gradient(135deg, var(--latte) 50%, transparent 50%);
      background-position: calc(100% - 18px) calc(1em + 2px), calc(100% - 12px) calc(1em + 2px);
      background-size: 6px 6px, 6px 6px;
      background-repeat: no-repeat;
    }

    button {
      width: 100%;
      padding: 16px 24px;
      border-radius: 999px;
      border: none;
      background: var(--accent);
      color: var(--forest);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover,
    button:focus-visible {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(192, 166, 140, 0.4);
    }

    .helper-text {
      font-size: 14px;
      text-align: center;
      margin-top: 20px;
      color: var(--forest);
    }

    .confirmation {
      margin-top: 30px;
      text-align: center;
      font-weight: 600;
      color: var(--forest);
      min-height: 24px;
    }

    .notice {
      margin: 16px 0 24px;
      padding: 12px 16px;
      border-radius: 12px;
      background: #f6efe6;
      color: var(--forest);
      font-size: 14px;
    }

    .error {
      color: var(--error);
      font-size: 14px;
      margin-top: -16px;
      margin-bottom: 24px;
    }

    @media (max-width: 600px) {
      .card {
        padding: 28px 22px;
      }

      .hero {
        padding: 60px 12px;
      }

      .hero__subtitle {
        letter-spacing: 0.2em;
      }

      .hero__nav {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="site">
    <header class="hero">
      <nav class="hero__nav" aria-label="Page menu">
        <a class="hero__back-link" id="backLink" href="index.html">&#8592; Back to main site</a>
        <div class="language-switcher">
          <label id="languageLabel" for="languageSelect">Language</label>
          <select id="languageSelect" aria-label="Language selector">
            <option value="en" selected>English</option>
            <option value="pl">Polski</option>
          </select>
        </div>
      </nav>
      <div class="hero__content">
        <h1 class="hero__title">Angelika &amp; Gabe</h1>
        <p class="hero__subtitle" id="heroSubtitle">Kindly RSVP</p>
      </div>
    </header>

    <main>
      <section class="card" aria-labelledby="rsvpTitle">
        <h2 id="rsvpTitle">RSVP Form</h2>
        <p id="cardIntro">Please share the names of all guests attending and let us know if you will be able to celebrate with us.</p>
        <form id="rsvpForm" novalidate>
          <label id="guestNamesLabel" for="guestNames">Name of Guest(s)</label>
          <textarea id="guestNames" name="guestNames" placeholder="Angelika &amp; Gabe" required maxlength="200" autocomplete="name" autocapitalize="words" aria-describedby="nameError" aria-invalid="false"></textarea>
          <div class="error" id="nameError" role="alert" aria-live="polite"></div>

          <label id="guestEmailLabel" for="guestEmail">Email Address</label>
          <input type="email" id="guestEmail" name="guestEmail" placeholder="name@email.com" required maxlength="254" autocomplete="email" inputmode="email" aria-describedby="emailError" aria-invalid="false" />
          <div class="error" id="emailError" role="alert" aria-live="polite"></div>

          <label id="attendanceLabel" for="attendance">Will you be attending?</label>
          <select id="attendance" name="attendance" required aria-invalid="false">
            <option value="" id="attendancePrompt">Select</option>
            <option value="yes" id="attendanceYes">Yes, we'll be there</option>
            <option value="no" id="attendanceNo">No, we are unable to attend</option>
          </select>
          <div class="error" id="attendanceError" role="alert" aria-live="polite"></div>

          <div style="position:absolute;left:-10000px;top:auto;width:1px;height:1px;overflow:hidden;" aria-hidden="true">
            <label for="website">Website</label>
            <input type="text" id="website" name="website" tabindex="-1" autocomplete="off" />
          </div>
          <input type="hidden" id="formStartTs" name="formStartTs" value="" />

          <button type="submit" id="submitButton">Submit</button>
        </form>
        <div class="confirmation" id="confirmation" aria-live="polite"></div>
      </section>
    </main>
  </div>

  <script>
    const translations = {
      en: {
        languageLabel: 'Language',
        backLink: '\u2190 Back to main site',
        heroSubtitle: 'Kindly RSVP',
        cardTitle: 'RSVP Form',
        cardIntro: 'Please share the names of all guests attending and let us know if you will be able to celebrate with us.',
        guestNamesLabel: 'Name of Guest(s)',
        guestNamesPlaceholder: 'Angelika & Gabe',
        guestEmailLabel: 'Email Address',
        guestEmailPlaceholder: 'name@email.com',
        attendanceLabel: 'Will you be attending?',
        selectPrompt: 'Select',
        selectYes: "Yes, we'll be there",
        selectNo: 'No, we are unable to attend',
        submitButton: 'Submit',
        validationNames: 'Please enter the guest name(s).',
        validationNameLength: 'Please keep the guest name(s) under 200 characters.',
        validationEmail: 'Please share a valid email address.',
        validationEmailLength: 'Please keep the email under 254 characters.',
        validationAttendance: 'Please let us know if you are attending.',
        submitting: 'Submitting\u2026',
        success: 'Thank you! Your RSVP has been recorded.',
        submitError: "We couldn't submit your RSVP. Please try again."
      },
      pl: {
        languageLabel: 'J\u0119zyk',
        backLink: '\u2190 Powr\u00f3t do strony g\u0142\u00f3wnej',
        heroSubtitle: 'Uprzejmie prosimy o potwierdzenie',
        cardTitle: 'Formularz RSVP',
        cardIntro: 'Podaj prosz\u0119 imiona wszystkich go\u015bci i daj nam zna\u0107, czy b\u0119dziecie \u015bwi\u0119towa\u0107 razem z nami.',
        guestNamesLabel: 'Imiona uczestnicz\u0105cych go\u015bci',
        guestNamesPlaceholder: 'Angelika i Gabe',
        guestEmailLabel: 'Adres email',
        guestEmailPlaceholder: 'name@email.com',
        attendanceLabel: 'Czy b\u0119dziesz uczestniczy\u0107?',
        selectPrompt: 'Wybierz',
        selectYes: 'Tak, b\u0119dziemy obecni',
        selectNo: 'Nie, nie mo\u017cemy przyby\u0107',
        submitButton: 'Wy\u015blij',
        validationNames: 'Wpisz prosz\u0119 imiona go\u015bci.',
        validationNameLength: 'Wpisz prosz\u0119 imiona go\u015bci (maksymalnie 200 znak\u00f3w).',
        validationEmail: 'Podaj poprawny adres email.',
        validationEmailLength: 'Podaj poprawny adres email (maksymalnie 254 znaki).',
        validationAttendance: 'Daj nam zna\u0107, czy b\u0119dziesz uczestniczy\u0107.',
        submitting: 'Wysy\u0142amy\u2026',
        success: 'Dzi\u0119kujemy! Twoja odpowied\u017a zosta\u0142a zapisana.',
        submitError: 'Nie uda\u0142o si\u0119 wys\u0142a\u0107 RSVP. Spr\u00f3buj ponownie.'
      }
    };

    const rsvpForm = document.getElementById('rsvpForm');
    const confirmationEl = document.getElementById('confirmation');
    const nameField = document.getElementById('guestNames');
    const emailField = document.getElementById('guestEmail');
    const attendanceField = document.getElementById('attendance');
    const nameError = document.getElementById('nameError');
    const emailError = document.getElementById('emailError');
    const attendanceError = document.getElementById('attendanceError');
    const backLink = document.getElementById('backLink');
    const heroSubtitle = document.getElementById('heroSubtitle');
    const cardTitle = document.getElementById('rsvpTitle');
    const cardIntro = document.getElementById('cardIntro');
    const guestNamesLabel = document.getElementById('guestNamesLabel');
    const guestEmailLabel = document.getElementById('guestEmailLabel');
    const attendanceLabel = document.getElementById('attendanceLabel');
    const submitButton = document.getElementById('submitButton');
    const attendancePrompt = document.getElementById('attendancePrompt');
    const attendanceYes = document.getElementById('attendanceYes');
    const attendanceNo = document.getElementById('attendanceNo');
    const languageLabel = document.getElementById('languageLabel');
    const languageSelect = document.getElementById('languageSelect');
    const honeypotField = document.getElementById('website');
    const formStartField = document.getElementById('formStartTs');
    let isSubmitting = false;

    function applyTranslations(lang = 'en') {
      const strings = translations[lang] || translations.en;
      document.documentElement.lang = lang;
      languageLabel.textContent = strings.languageLabel;
      backLink.textContent = strings.backLink;
      heroSubtitle.textContent = strings.heroSubtitle;
      cardTitle.textContent = strings.cardTitle;
      cardIntro.textContent = strings.cardIntro;
      guestNamesLabel.textContent = strings.guestNamesLabel;
      nameField.placeholder = strings.guestNamesPlaceholder;
      guestEmailLabel.textContent = strings.guestEmailLabel;
      emailField.placeholder = strings.guestEmailPlaceholder;
      attendanceLabel.textContent = strings.attendanceLabel;
      attendancePrompt.textContent = strings.selectPrompt;
      attendanceYes.textContent = strings.selectYes;
      attendanceNo.textContent = strings.selectNo;
      submitButton.textContent = strings.submitButton;
    }

    applyTranslations(languageSelect.value);

    languageSelect.addEventListener('change', (event) => {
      applyTranslations(event.target.value);
    });

    formStartField.value = Date.now().toString();

    function clearFieldError(field, errorEl) {
      errorEl.textContent = '';
      field.setAttribute('aria-invalid', 'false');
    }

    function setFieldError(field, errorEl, message) {
      errorEl.textContent = message;
      field.setAttribute('aria-invalid', 'true');
    }

    rsvpForm.addEventListener('submit', async function (event) {
      event.preventDefault();

      clearFieldError(nameField, nameError);
      clearFieldError(emailField, emailError);
      clearFieldError(attendanceField, attendanceError);
      confirmationEl.textContent = '';

      const names = nameField.value.trim();
      const email = emailField.value.trim();
      const attending = attendanceField.value;
      const strings = translations[languageSelect.value] || translations.en;

      if (!names) {
        setFieldError(nameField, nameError, strings.validationNames);
      } else if (names.length > 200) {
        setFieldError(nameField, nameError, strings.validationNameLength);
      }

      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        setFieldError(emailField, emailError, strings.validationEmail);
      } else if (email.length > 254) {
        setFieldError(emailField, emailError, strings.validationEmailLength);
      }

      if (!attending) {
        setFieldError(attendanceField, attendanceError, strings.validationAttendance);
      }

      if (!names || names.length > 200 || !email || email.length > 254 || !attending) {
        return;
      }

      if (isSubmitting) {
        return;
      }

      isSubmitting = true;
      submitButton.disabled = true;
      confirmationEl.textContent = strings.submitting;

      let responseTraceId = null;
      const requestUrl = '/api/rsvp';
      try {
        const response = await fetch(requestUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: names,
            attending: attending === 'yes',
            email,
            language: languageSelect.value,
            website: honeypotField.value,
            formStartTs: formStartField.value
          })
        });

        const responseText = await response.text();
        let json = null;
        let parseError = null;
        try {
          json = responseText ? JSON.parse(responseText) : null;
        } catch (error) {
          parseError = error;
        }

        console.info('RSVP submit diagnostics', {
          requestUrl,
          status: response.status,
          responseText,
          parsedJson: json,
          parseError: parseError ? String(parseError) : null
        });

        responseTraceId = json?.traceId ?? null;
        const isServerSuccess = json?.ok === true;
        const isServerFailure = json?.ok === false;

        if (parseError && !response.ok) {
          console.error('RSVP submit failed due to JSON parse + non-2xx status', {
            status: response.status,
            responseText
          });
          throw new Error(strings.submitError);
        }

        if ((!response.ok && !isServerSuccess) || isServerFailure) {
          console.error('RSVP submit failed:', {
            status: response.status,
            statusText: response.statusText,
            body: json ?? responseText
          });
          throw new Error(strings.submitError);
        }

        confirmationEl.textContent = strings.success;
        rsvpForm.reset();
        formStartField.value = Date.now().toString();
      } catch (error) {
        console.error('RSVP submission failed', {
          error,
          traceId: responseTraceId
        });
        confirmationEl.textContent = responseTraceId
          ? `${strings.submitError} (Trace ID: ${responseTraceId})`
          : strings.submitError;
      } finally {
        isSubmitting = false;
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
